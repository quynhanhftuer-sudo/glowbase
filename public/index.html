<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glow Base — Tìm Concept Makeup phù hợp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Be+Vietnam+Pro:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --primary: #6B4E71;       /* Deep Lavender Plum */
  --primary-soft: #F1EAF4;
  --secondary: #8B9A72;     /* Sage Green */
  --secondary-soft: #EEF1E7;
  --accent: #C9A15D;        /* Soft Gold */
  --cream: #EFE6D8;         /* Cream */
  --cream-soft: #FBF8F3;

  --bg: #FBF7F2;
  --text: #3A2E3F;
  --text2: #8A7F8E;
  --border: #E8DEE9;
  --white: #fff;

  --radius-card: 20px; 
  --radius-input: 14px; 
  --radius-pill: 999px;
  --shadow: 0 8px 24px rgba(107, 78, 113, 0.10);
  color-scheme: light;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Be Vietnam Pro',sans-serif;padding-top:env(safe-area-inset-top,0px);}
h1,h2,h3,.brand{font-family:'EB Garamond',serif;}
a{color:inherit;text-decoration:none;cursor:pointer;}
img{max-width:100%;}
button{font-family:inherit;cursor:pointer;border:none;outline:none;}
@media (min-width:900px){ body{cursor:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"><text y="20" font-size="20">💄</text></svg>') 4 20, auto;} }

/* Header */
header{position:sticky;top:0;z-index:50;background:rgba(252,251,249,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top,0px));}
.header-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;}
.brand{font-size:24px;font-weight:700;color:var(--primary);white-space:nowrap;}
.search-box{flex:1;display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-pill);padding:10px 16px;max-width:420px;}
.search-box input{border:none;outline:none;flex:1;font-size:15px;background:transparent;font-family:inherit;}
nav{display:flex;align-items:center;gap:20px;margin-left:auto;font-weight:500;font-size:15px;}
nav a{color:var(--text2); transition: 0.2s;}
nav a:hover, nav a.active{color:var(--primary);}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--secondary-soft);padding:6px 14px 6px 8px;border-radius:var(--radius-pill);font-weight:600;font-size:14px;color:#436b63;}
.avatar-dot{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--primary));display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;}
.avatar-btn{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--primary));display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:700;cursor:pointer;border:2px solid var(--white);box-shadow:0 2px 6px rgba(0,0,0,.1);}
.auth-wrap{position:relative;}
.dropdown{position:absolute;top:48px;right:0;background:var(--white);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);min-width:180px;overflow:hidden;z-index:60;}
.dropdown a,.dropdown span{display:block;padding:12px 18px;font-size:14px;font-weight:500;color:var(--text);cursor:pointer;}
.dropdown a:hover,.dropdown span:hover{background:var(--primary-soft);color:var(--primary);}
.dropdown .divider{border-top:1px solid var(--border);margin:0;padding:0;}
.photo-upload-btn{display:inline-flex;align-items:center;gap:6px;background:var(--secondary-soft);color:#436b63;padding:9px 16px;border-radius:var(--radius-pill);font-weight:500;font-size:14px;cursor:pointer;}
.photo-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.photo-preview .ph{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;}
.photo-preview .ph img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-preview .ph .rm{position:absolute;top:2px;right:2px;width:18px;height:18px;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;}
.fb-photos img{width:100%;height:100%;object-fit:cover;border-radius:10px;cursor:pointer;}
.btn{padding:10px 22px;border-radius:var(--radius-pill);font-weight:600;font-size:15px;transition:0.15s;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-ghost{background:var(--white);border:1px solid var(--border);color:var(--text);}
.btn-primary:active{transform:scale(.97);background:#c2592b;}
.btn-ghost:active{transform:scale(.97);}

main{max-width:1180px;margin:0 auto;padding:28px 20px 60px;min-height:60vh;}

/* Hero */
.hero{text-align:center;padding:30px 20px 40px;position:relative;overflow:hidden;}
.hero::before,.hero::after{content:'';position:absolute;width:220px;height:220px;background-repeat:no-repeat;background-size:contain;opacity:.14;pointer-events:none;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><path d="M20 180 C 40 120, 60 90, 100 60 C 130 38, 150 30, 180 20" stroke="%236B4E71" stroke-width="2" fill="none"/><ellipse cx="105" cy="58" rx="13" ry="7" fill="%236B4E71" transform="rotate(35 105 58)"/><ellipse cx="80" cy="80" rx="11" ry="6" fill="%238B9A72" transform="rotate(20 80 80)"/><ellipse cx="55" cy="112" rx="12" ry="6" fill="%236B4E71" transform="rotate(50 55 112)"/><ellipse cx="140" cy="40" rx="10" ry="5" fill="%238B9A72" transform="rotate(-15 140 40)"/></svg>');}
.hero::before{top:-40px;left:-60px;}
.hero::after{bottom:-40px;right:-60px;transform:rotate(180deg);}
.hero h1{font-size:44px;font-weight:600;font-style:italic;color:var(--primary);margin:0 0 10px;position:relative;z-index:1;}
.hero p{color:var(--text2);font-size:16px;max-width:480px;margin:0 auto 26px;position:relative;z-index:1;}
.hero-search{position:relative;z-index:1;max-width:560px;margin:0 auto;display:flex;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-pill);padding:6px 6px 6px 20px;box-shadow:var(--shadow);}
.hero-search input{flex:1;border:none;outline:none;font-size:15px;font-family:inherit;background:transparent;}

/* List rows (one product per row) */
.list{display:flex;flex-direction:column;gap:16px;}
.mua-row{background:var(--white);border-radius:var(--radius-card);overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow);display:flex;gap:18px;padding:16px;transition:transform 0.2s;cursor:pointer;align-items:flex-start;}
.mua-row:hover{transform:translateY(-2px);}
.row-photo{width:130px;height:130px;border-radius:16px;position:relative;display:flex;align-items:center;justify-content:center;font-size:44px;flex-shrink:0;}
.heart{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.85);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;color:#ccc;transition:transform .15s;}
.heart.filled{color:var(--primary);}
.heart:active{transform:scale(1.25);}
.row-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
.row-body h3{margin:0;font-size:22px;color:var(--primary);font-family:'EB Garamond',serif;font-weight:600;}
.row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.rating-line{font-size:14px;color:var(--text2);}
.rating-line b{color:var(--text);}
.price-line{font-weight:600;font-size:16px;color:var(--secondary);}
.loc-line{font-size:14px;color:var(--text2);}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.tag{background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:500;padding:4px 10px;border-radius:var(--radius-pill);}
.chip-select{display:inline-block;padding:7px 15px;margin:0 8px 8px 0;border-radius:var(--radius-pill);border:1px solid var(--border);font-size:13px;font-weight:500;color:var(--text);cursor:pointer;background:var(--white);transition:.15s;}
.chip-select.on{background:var(--primary);color:#fff;border-color:transparent;}
.chip-select:hover{border-color:var(--primary);}
@media (max-width:600px){ .mua-row{flex-direction:column;} .row-photo{width:100%;height:150px;} }

/* Explore layout */
.explore-layout{display:grid;grid-template-columns:240px 1fr;gap:30px;align-items:start;}
.filters{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-card);padding:22px;position:sticky;top:90px;}
.filters h4{margin:18px 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text);font-family:'Be Vietnam Pro',sans-serif;font-weight:600;}
.filters h4:first-child{margin-top:0;}
.check-row{display:flex;align-items:center;gap:8px;font-size:15px;padding:5px 0;cursor:pointer;}
.check-row label{cursor:pointer;flex:1;}
.check-row input{accent-color:var(--primary);width:16px;height:16px;}
.result-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
select{border:1px solid var(--border);border-radius:var(--radius-input);padding:8px 12px;font-family:inherit;font-size:14px;background:var(--white);outline:none;cursor:pointer;}
.empty{text-align:center;padding:60px 20px;color:var(--text2);}
.empty .big{font-size:36px;color:var(--cream);margin-bottom:10px;}

/* Detail */
.detail-top{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;margin-bottom:30px;}
.gallery-main{height:300px;border-radius:var(--radius-card);display:flex;align-items:center;justify-content:center;font-size:64px;margin-bottom:10px;}
.gallery-thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.gallery-thumbs div{height:80px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;}
.detail-info h1{font-size:32px;margin:0 0 6px;color:var(--primary);}
.detail-info .big-rating{font-size:15px;margin-bottom:14px;color:var(--text2);}
.detail-info .price{font-size:20px;font-weight:600;color:var(--secondary);margin-bottom:14px;}
.info-row{font-size:15px;color:var(--text2);margin-bottom:10px;}
.contact-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;}
.contact-btn{background:var(--secondary-soft);color:#436b63;padding:10px 18px;border-radius:var(--radius-pill);font-weight:500;font-size:14px;display:flex;align-items:center;gap:6px;}
.fav-btn-big{margin-top:16px;background:var(--white);border:1.5px solid var(--primary);color:var(--primary);padding:10px 22px;border-radius:var(--radius-pill);font-weight:600;}
.fav-btn-big.on{background:var(--primary);color:#fff;}
.block{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-card);padding:26px;margin-bottom:26px;}
.block h2{font-size:22px;margin:0 0 16px;}
.demo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;}
.demo-grid div{height:120px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;}

/* Feedback */
.fb-header{display:flex;gap:30px;flex-wrap:wrap;margin-bottom:20px;}
.fb-score{text-align:center;}
.fb-score .num{font-size:42px;font-weight:700;color:var(--primary);line-height:1;}
.dist-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);margin-bottom:6px;cursor:pointer;}
.dist-bar{flex:1;height:8px;background:var(--cream-soft);border-radius:5px;overflow:hidden;min-width:100px;}
.dist-fill{height:100%;background:var(--primary);}
.star-filter{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.pill{background:var(--white);border:1px solid var(--border);padding:8px 18px;border-radius:var(--radius-pill);font-weight:500;font-size:14px;color:var(--text);white-space:nowrap;}
.pill.on{background:var(--primary);color:#fff;border-color:transparent;}
.fb-card{border-top:1px solid var(--border);padding:20px 0;}
.fb-top{display:flex;justify-content:space-between;align-items:flex-start;}
.fb-user{display:flex;gap:12px;align-items:center;}
.fb-user b{font-size:15px;font-family:'EB Garamond',serif;}
.fb-stars{color:var(--accent);font-size:14px;}
.fb-date{font-size:13px;color:var(--text2);}
.fb-text{margin:10px 0;font-size:15px;line-height:1.6;}
.fb-photos{display:flex;gap:8px;}
.fb-photos div{width:64px;height:64px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.fb-actions{display:flex;gap:14px;font-size:13px;font-weight:600;color:var(--secondary);margin-top:10px;}
.fb-actions span{cursor:pointer;}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(69,63,59,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--white);border-radius:var(--radius-card);width:100%;max-width:400px;padding:32px;position:relative;max-height:85vh;overflow:auto;}
.modal.wide{max-width:480px;}
.modal h2{text-align:center;color:var(--primary);margin:0 0 6px;}
.modal .sub{text-align:center;color:var(--text2);font-size:15px;margin-bottom:24px;}
.modal .close{position:absolute;top:16px;right:20px;background:none;font-size:24px;color:var(--text2);}
label{font-size:14px;font-weight:600;display:block;margin:14px 0 6px;}
input[type=text],input[type=email],input[type=password],textarea{width:100%;border:1px solid var(--border);border-radius:var(--radius-input);padding:12px 14px;font-family:inherit;font-size:15px;outline:none;background:var(--bg);}
input:focus,textarea:focus,select:focus{border-color:var(--primary);}
textarea{resize:vertical;min-height:100px;}
.modal .btn{width:100%;margin-top:20px;}
.switch-line{text-align:center;font-size:14px;color:var(--text2);margin-top:18px;}
.switch-line b{color:var(--primary);cursor:pointer;}
.star-picker{display:flex;gap:6px;font-size:32px;color:var(--border);}
.star-picker span{cursor:pointer;transition:0.2s;}
.star-picker span.on{color:var(--accent);}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 26px;border-radius:var(--radius-pill);font-size:15px;font-weight:500;z-index:200;box-shadow:var(--shadow);}
.lightbox{position:fixed;inset:0;background:rgba(20,15,12,.95);z-index:150;display:flex;align-items:center;justify-content:center;}
.lightbox .lb-emoji{font-size:120px;}
.lightbox .lb-close{position:absolute;top:20px;right:30px;color:#fff;font-size:36px;background:none;}
.lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:40px;background:none;padding:10px;}
.lb-prev{left:20px;} .lb-next{right:20px;}

footer{border-top:1px solid var(--border);margin-top:50px;padding:40px 20px;text-align:center;color:var(--text2);font-size:14px;}
footer .brand{font-size:20px;color:var(--primary);margin-bottom:10px;}
footer .disclaimer{max-width:520px;margin:14px auto 0;font-size:13px;line-height:1.5;}

.confirm-box{text-align:center;}
.confirm-actions{display:flex;gap:12px;margin-top:24px;}
.confirm-actions .btn{flex:1;}

@media (max-width:820px){
  .explore-layout{grid-template-columns:1fr;}
  .filters{position:static; padding:16px;}
  .detail-top{grid-template-columns:1fr;}
  .hero h1{font-size:32px;}
  nav .nav-links{display:none;}
}

:root{--primary:#8A5F80;--primary-soft:#EBDDF3;--secondary:#7F9058;--secondary-soft:#E4EACF;--accent:#B98F4E;--cream:#F3EBD3;--cream-soft:#FBF7EA;--bg:#FBF6E8;--text:#43334A;--text2:#8B7C8C;--border:#DCCBE3;--lilac:#E4D3F0;--sage:#BCC796}
body{background:var(--bg) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='6' height='6'><circle cx='1' cy='1' r='.5' fill='%238A5F80' opacity='.06'/></svg>");font-family:'Be Vietnam Pro',sans-serif}
h1,h2,h3,.brand{font-family:'EB Garamond',serif}
header{background:rgba(251,246,232,.94);border-bottom:1px solid var(--sage)}
.brand{font-style:italic;letter-spacing:.5px}
.top-strip{background:var(--primary);color:#F5ECF7;text-align:center;font-size:12px;letter-spacing:2px;text-transform:uppercase;padding:7px 10px;font-family:'EB Garamond',serif;font-weight:600}
.hero{background:var(--lilac);border-radius:0 0 46% 46%/0 0 60px 60px;margin:-28px -20px 34px;padding:46px 20px 60px}
.hero h1{font-family:'Playfair Display','EB Garamond',serif;font-size:46px;font-style:italic;font-weight:500;color:var(--primary)}
.hero p{color:#6d5a70}
.hero::before,.hero::after{display:none}
.hero .deco{position:absolute;pointer-events:none;background-repeat:no-repeat;background-size:contain}
.hero .d1{left:2%;top:10px;width:190px;height:190px;opacity:.55}.hero .d2{right:2%;bottom:0;width:230px;height:230px;opacity:.7}
.hero-search{border:1px solid var(--primary);}
.btn-primary{background:var(--primary);letter-spacing:.5px}
.filters{background:var(--lilac);border:none;border-radius:200px 200px 24px 24px/90px 90px 24px 24px;padding:56px 24px 26px}
.filters h4{font-family:'EB Garamond',serif;font-size:17px;text-transform:none;letter-spacing:.4px;color:var(--primary);border-bottom:1px solid #c9b3d6;padding-bottom:4px}
.chip-select{background:#fff;border-color:#cdb9d8;color:var(--primary)}.chip-select.on{background:var(--secondary);color:#fff}
.tag{background:var(--secondary-soft);color:#5c6c3b;border:1px solid #cfd8b0;cursor:pointer}
.tag.t-c{background:var(--primary-soft);color:var(--primary);border-color:#d5c0e0}
.list{gap:22px}
.mua-row{background:var(--cream-soft);border:1px solid #cfd8b0;border-radius:22px;box-shadow:0 10px 26px rgba(138,95,128,.10);padding:16px;gap:22px;align-items:center}
.row-photo{width:150px;height:190px;border-radius:75px 75px 14px 14px;overflow:hidden;border:3px solid #fff;outline:1px solid var(--sage)}
.row-photo svg.fl{opacity:.9}
.row-body h3{font-size:26px;color:var(--primary);cursor:pointer}
.row-body h3:hover,.lnk:hover{text-decoration:underline}
.lnk{color:var(--primary);font-weight:600;cursor:pointer}
.price-line{color:var(--secondary);font-size:18px;font-family:'EB Garamond',serif;font-weight:700}
.sort-bar{display:flex;align-items:center;gap:10px}
.sort-bar .lbl{font-size:12px;letter-spacing:2px;color:var(--text2);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;background:#fff;border:1px solid #d9cce0;color:var(--text);font-size:15px;font-weight:500}
.pill.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.pill .ar{font-size:13px;opacity:.7}
.result-bar b{font-family:'EB Garamond',serif;font-size:22px;color:var(--primary)}
.block{background:var(--cream-soft);border-color:#cfd8b0}
.block h2{color:var(--primary);font-size:26px}
.arch{border-radius:999px 999px 18px 18px;overflow:hidden;display:flex;align-items:center;justify-content:center;border:4px solid #fff;outline:1px solid var(--sage)}
.detail-top{grid-template-columns:minmax(0,.9fr) 1.1fr;align-items:start}
.gallery-one{height:440px;position:relative;cursor:pointer}
.more-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.more-grid .arch{height:200px;cursor:pointer}
.detail-info h1{font-size:40px}
.contact-btn{background:var(--secondary-soft);color:#4c5c2e;border:1px solid #cfd8b0;max-width:100%}
.fb-meta{font-size:13px;color:var(--text2);margin:8px 0;display:flex;gap:6px 14px;flex-wrap:wrap;border-left:3px solid var(--sage);padding-left:10px}
.avatar-btn{position:relative;overflow:visible}
.av-cam{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--secondary);border:2px solid #fff;display:flex;align-items:center;justify-content:center}
.av-cam svg{width:10px;height:10px}
.avatar-btn,.avatar-dot{background:linear-gradient(135deg,var(--accent),var(--primary))}
.artist-head{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.artist-head .mono{width:150px;height:190px;font-family:'Playfair Display',serif;font-style:italic;font-size:60px;color:#fff}
.more-btn{display:block;margin:26px auto 0}
footer{background:var(--sage);border-top:none;color:#4b5a2d;margin-top:60px}
footer .brand{color:var(--primary)}
.foot-deco{height:26px;background:var(--primary)}
@media(max-width:820px){.detail-top{grid-template-columns:1fr}.gallery-one{height:340px}.hero{border-radius:0 0 40px 40px;margin:-28px -20px 24px}.hero h1{font-size:32px}.hero .deco{opacity:.25}.filters{border-radius:28px;padding:22px}}

main,footer{position:relative;z-index:1}
.fr{aspect-ratio:1;position:relative;background:#fff;border:1px solid var(--accent);padding:7px;box-shadow:0 8px 20px rgba(138,95,128,.15)}
.fr::after{content:'';position:absolute;inset:3px;border:1px solid var(--sage);pointer-events:none}
.fi{width:100%;height:100%;background-size:cover;background-position:center;filter:sepia(.18) saturate(.95)}
.row-photo{width:170px;height:170px;border-radius:0;border:none;outline:none;background:none;overflow:visible;display:block}
.row-photo .heart{top:12px;right:12px;z-index:2}
.filters{border-radius:4px;border:1px solid var(--accent);background:var(--lilac);padding:26px 22px;outline:1px solid var(--sage);outline-offset:-6px}
.mua-row{border-radius:4px;border:1px solid var(--accent)}
.block{border-radius:4px;border:1px solid var(--accent)}
.tag{border-radius:4px}.chip-select{border-radius:4px}.pill{border-radius:4px}
.btn{border-radius:4px;letter-spacing:.6px}.hero-search,.search-box{border-radius:4px}
.pg-title{font-style:italic;font-size:40px;color:var(--primary);margin:0 0 6px}
.orn{display:flex;align-items:center;gap:12px;color:var(--accent);margin:0 0 22px;font-size:13px;letter-spacing:3px}.orn::before,.orn::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.ci{width:42px;height:42px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:#fff;border:2px solid #fff;outline:1px solid var(--accent);transition:transform .15s}.ci:hover{transform:translateY(-2px)}
.ci svg{width:20px;height:20px}
.gallery-one{height:auto;border-radius:0;border:none;outline:none;background:none;display:block}
.more-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.more-grid .fr{cursor:pointer}
.lhero{position:relative;background:var(--cream-soft);margin:-28px -20px 0;padding:56px 20px 64px;overflow:hidden;border-bottom:1px solid var(--sage)}
.lhero .ld{position:absolute;mix-blend-mode:multiply;pointer-events:none}
.lhero .bf{left:-40px;top:-10px;width:520px;max-width:60%;opacity:.9}.lhero .fl{right:-20px;top:-10px;width:460px;max-width:55%;opacity:.9}
.lh-grid{position:relative;z-index:1;max-width:1100px;margin:0 auto;display:grid;grid-template-columns:190px 1fr 190px;gap:34px;align-items:center}
.lh-grid .fr:first-child{transform:rotate(-3deg)}.lh-grid .fr:last-child{transform:rotate(2.5deg);margin-top:60px}
.lh-mid{text-align:center;background:rgba(251,246,232,.86);padding:26px 22px;border:1px solid var(--sage);outline:1px solid var(--accent);outline-offset:-7px}
.lh-mid .kick{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--secondary);font-weight:600}
.lh-mid h1{font-family:'Playfair Display',serif;font-style:italic;font-weight:500;font-size:44px;color:var(--primary);margin:8px 0 10px;line-height:1.1}
.lh-mid p{color:#6d5a70;max-width:440px;margin:0 auto 20px}
.crown{color:var(--accent);font-size:30px;line-height:1}
.band{padding:40px 20px;text-align:center;margin:0 -20px}
.band.sage{background:var(--sage);color:#3f4b25}.band.lilac{background:var(--lilac)}
.band h2{font-style:italic;font-size:34px;margin:0 0 8px;color:var(--primary)}.band.sage h2{color:#fff}
.band p{max-width:560px;margin:0 auto 18px;line-height:1.7}
.sec{margin:44px 0}.sec h2{font-style:italic;font-size:30px;color:var(--primary);margin:0 0 4px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;max-width:1000px;margin:24px auto 0}
.tile{cursor:pointer;text-align:left}.tile .cap{font-family:'EB Garamond',serif;font-size:20px;color:var(--primary);margin-top:10px;font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.pcard{background:var(--cream-soft);border:1px solid var(--accent);padding:14px;cursor:pointer;transition:transform .2s}.pcard:hover{transform:translateY(-3px)}
.pcard .fr{position:relative}.pcard .heart{top:14px;right:14px;z-index:2;position:absolute}
.pcard h3{margin:12px 0 2px;font-size:20px;color:var(--primary)}
.pcard .by{font-size:14px;color:var(--text2)}
.princess{position:relative;overflow:hidden;background:var(--lilac);margin:44px -20px;padding:54px 20px}
.princess .in{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:200px 1fr;gap:38px;align-items:center;position:relative;z-index:1}
.princess .horse{position:absolute;right:2%;bottom:-6px;width:340px;opacity:.16;mix-blend-mode:multiply}
.princess .orn2{position:absolute;right:0;top:0;height:100%;mix-blend-mode:multiply;opacity:.55;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%)}
.princess .stack{display:flex;flex-direction:column;gap:14px}
.princess h2{font-family:'Playfair Display',serif;font-style:italic;font-weight:500;font-size:34px;color:var(--primary);margin:0 0 10px}
.princess p{line-height:1.75;color:#5c4a5f;max-width:520px}
.agg-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border);font-size:15px;flex-wrap:wrap}
.agg-row .lnk{min-width:150px}
footer::before{content:'';display:block;height:1px}
@media(max-width:820px){.lh-grid{grid-template-columns:1fr}.lh-grid .fr{width:150px;margin:0 auto!important}.lh-grid .fr:last-child{display:none}.tiles{grid-template-columns:repeat(2,1fr)}.pgrid{grid-template-columns:1fr 1fr}.princess .in{grid-template-columns:1fr}.princess .stack{flex-direction:row}.lh-mid h1{font-size:32px}body::before,body::after{opacity:.16}}
@media(max-width:600px){.row-photo{width:110px;height:110px}.pgrid{grid-template-columns:1fr}.mua-row{flex-direction:row}}

.ci-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ci-item{display:inline-flex;align-items:center;gap:8px;color:var(--text);font-size:14px;font-weight:500;padding-right:6px;text-decoration:none;max-width:100%}
.ci-item .ci{width:34px;height:34px;flex-shrink:0}.ci-item .ci svg{width:17px;height:17px}
.ci-item span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;border-bottom:1px dotted var(--accent)}
.ci-item:hover .t{color:var(--primary)}
.pf-cover{height:170px;background:var(--lilac);position:relative;overflow:hidden;border:1px solid var(--accent);border-bottom:none}
.pf-cover img{position:absolute;mix-blend-mode:multiply;opacity:.85}

  else { list = [...list, id]; toast('Đã lưu vào danh sách ♡'); }
  favorites[currentUser.id]=list;
  render();
}

function filteredMuas(){
  let list = muas.filter(m=>{
    if(exploreState.q){
      const q = exploreState.q.toLowerCase();
      const hay = (m.name+' '+(m.concepts||[]).join(' ')+' '+(m.areas||[]).join(' ')+' '+m.address).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(exploreState.locs.length && !exploreState.locs.some(l=>(m.areas||[]).includes(l))) return false;
    if(exploreState.concepts.length && !exploreState.concepts.every(c=>(m.concepts||[]).includes(c))) return false;
    if(exploreState.price.length){
      const ok = exploreState.price.some(p=>{
        if(p==='u500') return m.priceMin<500000;
        if(p==='500-1m') return m.priceMin<1000000 && m.priceMax>=500000;
        if(p==='1-2m') return m.priceMin<2000000 && m.priceMax>=1000000;
        if(p==='2-3m') return m.priceMin<3000000 && m.priceMax>=2000000;
        if(p==='o3m') return m.priceMax>=3000000;
      });
      if(!ok) return false;
    }
    if(exploreState.rating && muaRating(m.id).avg < exploreState.rating) return false;
    return true;
  });
  if(exploreState.sortField==='price') list.sort((a,b)=> exploreState.sortDir==='desc'? b.priceMin-a.priceMin : a.priceMin-b.priceMin);
  else if(exploreState.sortField==='rating') list.sort((a,b)=> exploreState.sortDir==='desc'? muaRating(b.id).avg-muaRating(a.id).avg : muaRating(a.id).avg-muaRating(b.id).avg);
  return list;
}

// ĐÂY LÀ HÀM RENDER CHÍNH THỨC, KHÔNG PHẢI CODE NHÁP
function render(){
  try {
    const app = document.getElementById('app');
    if(!app) return; // Bảo vệ an toàn

    const navH = document.getElementById('navHome');
    const navF = document.getElementById('navFav');
    if(navH) navH.classList.remove('active');
    if(navF) navF.classList.remove('active');
    
    if(route.page==='home' || route.page==='explore') {
        if(navH) navH.classList.add('active');
        app.innerHTML = renderHome();
    }
    else if(route.page==='detail') app.innerHTML = renderDetail();
    else if(route.page==='favorites') {
        if(navF) navF.classList.add('active');
        app.innerHTML = renderFavorites();
    }
    else if(route.page==='profile') app.innerHTML = renderProfile();

    document.getElementById('authArea').innerHTML = currentUser
      ? `<div class="avatar-btn" onclick="toggleAuthDropdown()" style="${currentUser.avatar?`background:url('${currentUser.avatar}') center/cover;`:''}">${currentUser.avatar?'':currentUser.name[0].toUpperCase()}</div>`
      : `<div class="avatar-btn" style="background:var(--border);color:var(--text2)" onclick="openModal('login')"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg></div>`;
    document.getElementById('authDropdown').style.display='none';
  } catch (err) {
    console.error("Render Error:", err);
    document.getElementById('app').innerHTML = `<div style="padding:40px;text-align:center;color:red;"><h2>Lỗi hiển thị!</h2><p>${err.message}</p></div>`;
  }
}

function openModal(kind){
  const root = document.getElementById('modalRoot');
  if(kind==='login'){

      <div class="modal">
        <button class="close" onclick="closeModal()">×</button>
        <h2>✦ Glow Base</h2>

        <button class="btn btn-primary" onclick="doLogin()">Đăng nhập</button>
        <div class="switch-line">Chưa có tài khoản? <b onclick="openModal('register')">Đăng ký</b></div>
      </div></div>`;
  } else if(kind==='register'){
    root.innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <button class="close" onclick="closeModal()">×</button>
        <h2>✦ Glow Base</h2>

        <label>Xác nhận mật khẩu</label><input type="password" id="regPass2" placeholder="••••••••">
        <button class="btn btn-primary" onclick="doRegister()">Đăng ký</button>
        <div class="switch-line">Đã có tài khoản? <b onclick="openModal('login')">Đăng nhập</b></div>
      </div></div>`;
  }
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function doLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  if(!u||!p){ toast('Vui lòng nhập đầy đủ thông tin'); return; }
  const rec = users[u];
  if(!rec || rec.pass!==p){ toast('Sai tài khoản hoặc mật khẩu'); return; }
  currentUser = {id:u, name:rec.name};
  closeModal(); toast('Đăng nhập thành công ✨'); render();
}
function doRegister(){
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const pass = document.getElementById('regPass').value;
  const pass2 = document.getElementById('regPass2').value;
  if(!name||!email||!pass){ toast('Vui lòng nhập đầy đủ thông tin'); return; }
  if(pass!==pass2){ toast('Mật khẩu xác nhận không khớp'); return; }
  if(users[email]){ toast('Email đã được đăng ký'); return; }
  users[email] = {name, pass};
  currentUser = {id:email, name};
  closeModal(); toast('Tạo tài khoản thành công ✨'); render();
}
function logout(){ currentUser=null; toast('Đã đăng xuất'); go('home'); }
function toggleAuthDropdown(){
  const dd = document.getElementById('authDropdown');
  if(dd.style.display==='block'){ dd.style.display='none'; return; }
  dd.innerHTML = `<a onclick="document.getElementById('avatarFileInput').click()">🖼️ Đổi ảnh đại diện</a><a onclick="closeAuthDropdown();go('favorites')">♡ Yêu thích</a><a onclick="closeAuthDropdown();go('profile')">★ Đánh giá của tôi</a><div class="divider"></div><span onclick="closeAuthDropdown();logout()">Đăng xuất</span>`;
  dd.style.display='block';
}
function closeAuthDropdown(){ document.getElementById('authDropdown').style.display='none'; }
document.addEventListener('click', e=>{
  const wrap = document.querySelector('.auth-wrap');
  if(wrap && !wrap.contains(e.target)) closeAuthDropdown();
});
function handleAvatarSelect(e){
  const file = e.target.files && e.target.files[0];
  if(!file || !currentUser) return;
  const reader = new FileReader();
  reader.onload = ev=>{ currentUser.avatar = ev.target.result; if(users[currentUser.id]) users[currentUser.id].avatar = ev.target.result; toast('Đã cập nhật ảnh đại diện ✨'); render(); };
  reader.readAsDataURL(file);
  e.target.value='';
}

let fbPhotoData = [];
function openFeedbackForm(muaId, editId){
  if(!currentUser){ openModal('login'); return; }
  const editing = editId? feedbacks.find(f=>f.id===editId) : null;
  fbPhotoData = editing && Array.isArray(editing.photos) ? [...editing.photos] : [];
  const root = document.getElementById('modalRoot');
  let rating = editing? editing.rating : 0;
  root.innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal wide">
      <button class="close" onclick="closeModal()">×</button>
      <h2>${editing? 'Sửa đánh giá':'Đánh giá trải nghiệm của bạn?'}</h2>
      <div class="star-picker" id="starPicker">${[1,2,3,4,5].map(s=>`<span data-s="${s}" onclick="pickStar(${s})">★</span>`).join('')}</div>
      <label>Nhận xét</label>
      <textarea id="fbText" placeholder="Trải nghiệm với layout makeup này thế nào?">${editing? editing.comment:''}</textarea>
      <label>Ảnh đính kèm</label>
      <input type="file" id="fbPhotoInput" accept="image/*" multiple style="display:none" onchange="handlePhotoSelect(event)">
      <label for="fbPhotoInput" class="photo-upload-btn">📷 Thêm ảnh</label>
      <div class="photo-preview" id="fbPhotoPreview"></div>
      <button class="btn btn-primary" onclick="submitFeedback(${muaId}, ${editId||'null'})">${editing? 'Lưu thay đổi':'Gửi đánh giá'}</button>
    </div></div>`;
  if(editing) pickStar(editing.rating);
  renderPhotoPreview();
}
function handlePhotoSelect(e){
  const files = Array.from(e.target.files||[]).slice(0, 6-fbPhotoData.length);
  let pending = files.length;
  if(!pending) return;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = ev=>{ fbPhotoData.push(ev.target.result); renderPhotoPreview(); };
    reader.readAsDataURL(file);
  });
  e.target.value='';
}
function removePhoto(i){ fbPhotoData.splice(i,1); renderPhotoPreview(); }
function renderPhotoPreview(){
  const el = document.getElementById('fbPhotoPreview');
  if(!el) return;
  el.innerHTML = fbPhotoData.map((src,i)=>`<div class="ph"><img src="${src}"><div class="rm" onclick="removePhoto(${i})">×</div></div>`).join('');
}
function pickStar(s){
  document.querySelectorAll('#starPicker span').forEach(el=>{
    el.classList.toggle('on', +el.dataset.s <= s);
  });
  document.getElementById('starPicker').dataset.val = s;
}
function submitFeedback(muaId, editId){
  const val = +(document.getElementById('starPicker').dataset.val||0);
  const text = document.getElementById('fbText').value.trim();
  const photos = [...fbPhotoData];
  if(!val){ toast('Vui lòng chọn số sao đánh giá'); return; }
  if(!text){ toast('Vui lòng nhập nội dung feedback'); return; }
  if(editId){
    const f = feedbacks.find(x=>x.id===editId);
    f.rating=val; f.comment=text; f.photos=photos; f.date=new Date().toISOString().slice(0,10);
    toast('Đã cập nhật đánh giá.');
  } else {
    feedbacks.push({id:Date.now(), muaId, userId:currentUser.id, userName:currentUser.name, rating:val, comment:text, photos, date:new Date().toISOString().slice(0,10)});
    toast('Đánh giá của bạn đã được đăng ✨');
  }
  fbPhotoData = [];
  closeModal(); render();
}
function confirmDeleteFeedback(id){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal confirm-box">
      <h2 style="font-size:20px; color:var(--text);">Bạn có chắc muốn xóa đánh giá này?</h2>
      <div class="confirm-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Hủy</button>
        <button class="btn btn-primary" onclick="deleteFeedback(${id})">Xóa</button>
      </div>
    </div></div>`;
}
function deleteFeedback(id){
  feedbacks = feedbacks.filter(f=>f.id!==id);
  closeModal(); toast('Đã xóa đánh giá.'); render();
}

function lightboxOpen(muaId, idx){
  detailState.gIdx = idx;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="lightbox">
    <button class="lb-close" onclick="closeModal()">×</button>
    <button class="lb-nav lb-prev" onclick="lightboxOpen(${muaId}, ${(idx+5)%6})">‹</button>
    <div class="lb-emoji">${portraitIcon(140)}</div>
    <button class="lb-nav lb-next" onclick="lightboxOpen(${muaId}, ${(idx+1)%6})">›</button>
  </div>`;
}
function photoLightbox(src){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="lightbox"><button class="lb-close" onclick="closeModal()">×</button><img src="${src}" style="max-width:90vw;max-height:85vh;border-radius:12px;object-fit:contain"></div>`;
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

render();
</script>

CONCEPTS.length=0;CONCEPTS.push('Cô dâu','Đi tiệc','Kỉ yếu','Cosplay');
LOCATIONS.length=0;LOCATIONS.push('Hà Nội','Bắc Ninh','Quảng Ninh','Hải Phòng','Nam Định');
exploreState={q:'',locs:[],concepts:[],price:[],types:[],rating:0,sortField:null,sortDir:null};
let shown=20;
const byId=id=>muas.find(m=>m.id===+id);
const rst=()=>{exploreState={q:'',locs:[],concepts:[],price:[],types:[],rating:0,sortField:null,sortDir:null};shown=20;};
function muaRating(id){const l=feedbacks.filter(f=>f.muaId===id);const m=byId(id);if(!l.length)return{avg:m?m.r0:0,count:0,dist:[0,0,0,0,0]};const dist=[0,0,0,0,0];l.forEach(f=>dist[f.rating-1]++);return{avg:l.reduce((s,f)=>s+f.rating,0)/l.length,count:l.length,dist};}
const flowerIcon=s=>`<img class="fl" src="${FLOWER}" style="width:${s}px;height:${s}px">`;
function portraitIcon(s=40){return flowerIcon(Math.round(s*1.6));}
function tagsHtml(m){return `<span class="tag t-c" onclick="event.stopPropagation();tagGo('concepts','${m.concept}')">${m.concept}</span><span class="tag">${m.studio?'Studio':'Tại gia'}</span>${m.mobile?'<span class="tag">Makeup tại nhà</span>':''}<span class="tag" onclick="event.stopPropagation();tagGo('locs','${m.province}')">${m.province}</span>`;}
function tagGo(k,v){rst();exploreState[k]=[v];go('home');}
const CI={phone:'📞',facebook:'Facebook',facebook_unlinked:'Facebook',instagram:'Instagram',tiktok:'TikTok',email:'✉',website:'🌐'};
function contactsHtml(m){return m.contacts.length?m.contacts.map(c=>`<a class="contact-btn" href="${c.href}" target="_blank" rel="noopener">${CI[c.type]||''} ${c.label||''}</a>`).join(''):'<span style="color:var(--text2);font-size:14px">Chưa có thông tin liên hệ công khai.</span>';}
function priceTxt(m){return m.base?m.price:'Liên hệ để báo giá';}
function muaCard(m){const r=muaRating(m.id);return `<div class="mua-row" onclick="go('detail',{id:${m.id}})">
<div class="row-photo arch" style="background:${PH[m.g]};position:relative">${flowerIcon(96)}<button class="heart ${isFav(m.id)?'filled':''}" onclick="event.stopPropagation();toggleFav(${m.id})">${heartIcon(isFav(m.id))}</button></div>
<div class="row-body"><div class="row-top"><h3>Makeup ${m.concept}</h3><div class="price-line">${priceTxt(m)}</div></div>
<div style="font-size:14px;color:var(--text2)">thực hiện bởi <span class="lnk" onclick="event.stopPropagation();go('artist',{id:${m.id}})">${m.name}</span></div>
<div class="rating-line"><b>★ ${r.avg.toFixed(1)}</b> ${r.count?'('+r.count+' đánh giá)':'(chưa có review)'}</div>
<div class="loc-line">📍 ${m.address}</div><div class="tag-row">${tagsHtml(m)}</div></div></div>`;}
function filteredMuas(){const s=exploreState;let l=muas.filter(m=>{
if(s.q&&!(m.name+' '+m.concept+' '+m.address+' '+m.province).toLowerCase().includes(s.q.toLowerCase()))return false;
if(s.locs.length&&!s.locs.includes(m.province))return false;
if(s.concepts.length&&!s.concepts.includes(m.concept))return false;
if(s.price.length&&!s.price.some(p=>m.base&&(p==='u500'?m.base<5e5:p==='500-1m'?m.base>=5e5&&m.base<1e6:p==='1-2m'?m.base>=1e6&&m.base<2e6:p==='2-3m'?m.base>=2e6&&m.base<3e6:m.base>=3e6)))return false;
if(s.types.length&&!s.types.includes(m.studio?'Studio':'Tại gia'))return false;return true;});
const sc=m=>(m.base?2:0)+(m.contacts.length?1:0);
const rt=m=>muaRating(m.id).avg,d=s.sortDir==='desc'?-1:1;
if(s.sortField==='price')l.sort((a,b)=>d*((a.base||(d<0?0:9e9))-(b.base||(d<0?0:9e9))));
else if(s.sortField==='rating')l.sort((a,b)=>d*(rt(a)-rt(b)));
else l.sort((a,b)=>sc(b)-sc(a)||rt(b)-rt(a));return l;}
function toggleFilter(k,v){const a=exploreState[k];exploreState[k]=a.includes(v)?a.filter(x=>x!==v):[...a,v];shown=20;render();}
function sortBtn(f,l){const on=exploreState.sortField===f;return `<button class="pill ${on?'on':''}" onclick="toggleSortField('${f}')">${l} <span class="ar">${on?(exploreState.sortDir==='desc'?'▼':'▲'):'⇅'}</span></button>`;}
function renderHome(){const list=filteredMuas();const chips=(k,arr)=>arr.map(c=>`<span class="chip-select ${exploreState[k].includes(c)?'on':''}" onclick="toggleFilter('${k}','${c}')">${c}</span>`).join('');
return `<section class="hero"><div class="deco d1" style="background-image:url('${BFLY}')"></div><div class="deco d2" style="background-image:url('${FLOWER}')"></div>
<h1>Find your perfect Concept ✿</h1><p>Khám phá những phong cách trang điểm phù hợp với bạn qua thư viện Concept Makeup từ các nghệ sĩ uy tín.</p>
<div class="hero-search"><input id="heroSearch" placeholder="Bạn đang tìm concept gì?" value="${exploreState.q}" onkeydown="if(event.key==='Enter'){exploreState.q=this.value;shown=20;render()}"><button class="btn btn-primary" onclick="exploreState.q=document.getElementById('heroSearch').value;shown=20;render()">Tìm kiếm</button></div></section>
<div class="explore-layout"><aside class="filters"><h2 style="font-style:italic;color:var(--primary);margin:0 0 14px;font-size:26px;text-align:center">Lọc</h2>
<h4>Khu vực</h4><div>${chips('locs',LOCATIONS)}</div><h4>Concept</h4><div>${chips('concepts',CONCEPTS)}</div>
<h4>Mức giá</h4><div>${[['u500','Dưới 500K'],['500-1m','500K – 1M'],['1-2m','1M – 2M'],['2-3m','2M – 3M'],['o3m','Trên 3M']].map(([k,l])=>`<span class="chip-select ${exploreState.price.includes(k)?'on':''}" onclick="toggleFilter('price','${k}')">${l}</span>`).join('')}</div>
<h4>Loại hình</h4>
<button class="btn btn-ghost" style="width:100%;margin-top:20px" onclick="rst();render()">Xóa tất cả bộ lọc</button></aside>
<div><div class="result-bar"><b>Tìm thấy ${list.length} Concept</b><div class="sort-bar"><span class="lbl">SORT BY</span>${sortBtn('price','Giá')}${sortBtn('rating','Đánh giá')}</div></div>
${list.length?`<div class="list">${list.slice(0,shown).map(muaCard).join('')}</div>${list.length>shown?`<button class="btn btn-ghost more-btn" onclick="shown+=20;render()">Xem thêm (${list.length-shown})</button>`:''}`:`<div class="empty"><div class="big">✿</div><p>Chưa tìm thấy Concept phù hợp ♡<br>Hãy thử điều chỉnh lại bộ lọc nhé!</p><button class="btn btn-primary" onclick="rst();render()">Bỏ bộ lọc</button></div>`}</div></div>`;}
function feedbackCard(f){const mine=currentUser&&f.userId===currentUser.id,av=mine&&currentUser.avatar,m=byId(f.muaId);
return `<div class="fb-card"><div class="fb-top"><div class="fb-user"><div class="avatar-dot" style="${av?`background:url('${av}') center/cover;`:''}">${av?'':(f.userName||'U')[0]}</div><div><b>${f.userName}</b><div class="fb-stars">${stars(f.rating)}</div></div></div><div class="fb-date">${fmtDate(f.date)}</div></div>
<div class="fb-text">${f.comment}</div>${Array.isArray(f.photos)&&f.photos.length?`<div class="fb-photos">${f.photos.map(s=>`<img src="${s}" onclick="photoLightbox('${s}')" style="width:64px;height:64px">`).join('')}</div>`:''}
${m?`<div class="fb-meta"><span>📅 ${fmtDate(f.date)}</span><span>Concept: <span class="lnk" onclick="go('detail',{id:${m.id}})">Makeup ${m.concept}</span></span><span>Artist: <span class="lnk" onclick="go('artist',{id:${m.id}})">${m.name}</span></span></div>`:''}
${mine?`<div class="fb-actions"><span onclick="openFeedbackForm(${f.muaId},${f.id})">Sửa</span><span onclick="confirmDeleteFeedback(${f.id})">Xóa</span></div>`:''}</div>`;}
function feedbackBlock(ids,formId){const r=ids.length===1?muaRating(ids[0]):null;const l=feedbacks.filter(f=>ids.includes(f.muaId)&&(!detailState.star||f.rating===detailState.star)).sort((a,b)=>b.id-a.id);
const all=feedbacks.filter(f=>ids.includes(f.muaId));const avg=all.length?all.reduce((s,f)=>s+f.rating,0)/all.length:(r?r.avg:0);const dist=[1,2,3,4,5].map(s=>all.filter(f=>f.rating===s).length);
return `<div class="block"><h2>Feedback</h2><div class="fb-header"><div class="fb-score"><div class="num">${avg.toFixed(1)}</div><div>${stars(avg,all.length>0)}</div><div style="font-size:13px;color:var(--text2);margin-top:4px">${all.length} reviews</div></div>
<div style="flex:1;min-width:180px">${[5,4,3,2,1].map(s=>`<div class="dist-row" onclick="detailState.star=${s===detailState.star?0:s};render()"><span style="width:30px;font-weight:600">${s}<span class="dstar${dist[s-1]?' on':''}">★</span></span><div class="dist-bar"><div class="dist-fill" style="width:${all.length?dist[s-1]/all.length*100:0}%"></div></div><span>${dist[s-1]}</span></div>`).join('')}</div></div>
<div class="star-filter"><button class="pill ${!detailState.star?'on':''}" onclick="detailState.star=0;render()">Tất cả</button>${[5,4,3,2,1].map(s=>`<button class="pill ${detailState.star===s?'on':''}" onclick="detailState.star=${s};render()">${s}★</button>`).join('')}</div>
${formId?`<button class="btn btn-primary" onclick="openFeedbackForm(${formId})">✿ Viết đánh giá</button>`:''}
<div style="margin-top:10px">${l.length?l.map(feedbackCard).join(''):`<div class="empty">Chưa có feedback nào.<br>Be the first one to share your experience ✿</div>`}</div></div>`;}
function renderDetail(){const m=byId(route.params.id);if(!m)return '<div class="empty">Concept không tồn tại.</div>';const r=muaRating(m.id);
return `<div class="detail-top"><div class="gallery-one arch" style="background:${PH[m.g]}" onclick="lightboxOpen(${m.id},0)">${flowerIcon(170)}</div>
<div class="detail-info"><h1>Makeup ${m.concept}</h1><div style="font-size:18px;margin-bottom:12px">Thực hiện bởi: <b class="lnk" style="font-family:'EB Garamond',serif;font-size:22px" onclick="go('artist',{id:${m.id}})">${m.name}</b></div>
<div class="big-rating">★ ${r.avg.toFixed(1)} / 5 &nbsp;·&nbsp; ${r.count} đánh giá</div><div class="price">${priceTxt(m)}</div><div class="info-row">📍 ${m.address}</div>
<div class="tag-row" style="margin:12px 0">${tagsHtml(m)}</div><div class="contact-row">${contactsHtml(m)}</div>
<button class="fav-btn-big ${isFav(m.id)?'on':''}" onclick="toggleFav(${m.id})">${heartIcon(isFav(m.id))} ${isFav(m.id)?'Đã lưu Concept':'Lưu Concept này'}</button></div></div>
<div class="block"><h2>Demo / Sample Looks</h2><div class="more-grid">${[1,2,3,4,5].map(i=>`<div class="arch" style="background:${PH[(m.g+i)%5]}" onclick="lightboxOpen(${m.id},${i})">${flowerIcon(80)}</div>`).join('')}</div></div>${feedbackBlock([m.id],m.id)}`;}
function renderArtist(){const m=byId(route.params.id);if(!m)return '<div class="empty">Artist không tồn tại.</div>';const mine=muas.filter(x=>x.name===m.name);const r=muaRating(m.id);
return `<div class="block"><div class="artist-head"><div class="arch mono" style="background:${PH[m.g]}">${m.name[0]}</div><div style="flex:1;min-width:240px"><div style="color:var(--text2);font-size:13px;letter-spacing:2px">ARTIST</div><h1 style="margin:2px 0 8px;font-size:38px;color:var(--primary)">${m.name}</h1>
<div class="big-rating">★ ${r.avg.toFixed(1)} · ${r.count} đánh giá</div><div class="info-row">📍 ${m.address}</div><div class="tag-row" style="margin:10px 0">${tagsHtml(m)}</div><div class="contact-row">${contactsHtml(m)}</div></div></div></div>
<h2 style="color:var(--primary);font-size:28px">Concept của ${m.name}</h2><div class="list">${mine.map(muaCard).join('')}</div><div style="height:26px"></div>${feedbackBlock(mine.map(x=>x.id),0)}`;}
function renderProfile(){if(!currentUser)return '<div class="empty">Đăng nhập để xem hồ sơ của bạn.</div>';const my=feedbacks.filter(f=>f.userId===currentUser.id).sort((a,b)=>b.id-a.id);
return `<div class="block" style="text-align:center;max-width:380px;margin:0 auto 22px"><div class="avatar-dot" style="width:84px;height:84px;font-size:34px;margin:0 auto 12px;${currentUser.avatar?`background:url('${currentUser.avatar}') center/cover;`:''}">${currentUser.avatar?'':currentUser.name[0]}</div><h2 style="margin:0;color:var(--primary)">${currentUser.name}</h2>
<div style="margin-top:10px"><span class="chip-select" onclick="document.getElementById('avatarFileInput').click()">📷 Đổi ảnh đại diện</span></div></div>
<h2 style="margin-top:0;color:var(--primary)">Đánh giá của tôi</h2>${my.length?my.map(f=>`<div class="block">${feedbackCard(f)}</div>`).join(''):'<div class="empty">Chưa có feedback nào.<br>Be the first one to share your experience ✿</div>'}`;}
function render(){try{const app=document.getElementById('app'),p=route.page;
document.getElementById('navHome').classList.toggle('active',p==='home');
app.innerHTML=p==='detail'?renderDetail():p==='artist'?renderArtist():p==='favorites'?renderFavorites():p==='profile'?renderProfile():renderHome();
document.getElementById('authArea').innerHTML=currentUser?`<div class="avatar-btn" title="Đổi ảnh / tài khoản" onclick="toggleAuthDropdown()" style="${currentUser.avatar?`background:url('${currentUser.avatar}') center/cover;`:''}">${currentUser.avatar?'':currentUser.name[0].toUpperCase()}<span class="av-cam">${cameraIcon(10)}</span></div>`:`<div class="avatar-btn" style="background:var(--border);color:var(--text2)" onclick="openModal('login')"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg></div>`;
document.getElementById('authDropdown').style.display='none';}catch(e){console.error(e);document.getElementById('app').innerHTML='<div style="padding:40px;text-align:center">Lỗi hiển thị: '+e.message+'</div>';}}
function toggleAuthDropdown(){const dd=document.getElementById('authDropdown');if(dd.style.display==='block'){dd.style.display='none';return;}
dd.innerHTML=`<a onclick="document.getElementById('avatarFileInput').click()">📷 Đổi ảnh đại diện</a><a onclick="closeAuthDropdown();go('favorites')">♡ Yêu thích</a><a onclick="closeAuthDropdown();go('profile')">★ Đánh giá của tôi</a><div class="divider"></div><span onclick="closeAuthDropdown();logout()">Đăng xuất</span>`;dd.style.display='block';}
function doGlobalSearch(){exploreState.q=document.getElementById('globalSearch').value;shown=20;go('home');}
document.querySelector('header').insertAdjacentHTML('beforebegin','<div class="top-strip">✿ Glow Base · Find your perfect makeup concept ✿</div>');
document.querySelector('footer').insertAdjacentHTML('beforebegin','<div class="foot-deco"></div>');
render();
</script>

<script>
/* ===== v3 ===== */

const STORY={'Cô dâu':['Chương I','Nàng dâu cổ tích','Ngày trọng đại xứng đáng với gương mặt rạng rỡ nhất: nền da mịn như sương sớm, ánh nhìn dịu dàng và lớp makeup bền đến tận cuối buổi tiệc.'],
'Đi tiệc':['Chương II','Dạ hội lấp lánh','Một đêm rực rỡ cần một diện mạo cuốn hút: đôi mắt long lanh, đôi môi kiêu kỳ và lớp nền giữ trọn từ lúc bước vào đến lúc ra về.'],
'Kỉ yếu':['Chương III','Mùa hè tuổi trẻ','Những bức ảnh cuối cấp xứng đáng được lưu lại thật đẹp: tươi tắn, trong trẻo, đủ nổi bật mà vẫn tự nhiên như chính bạn.'],
'Cosplay':['Chương IV','Bước ra từ trang truyện','Hóa thân thành nhân vật bạn yêu: đường nét, màu sắc và từng chi tiết được dựng công phu để bạn thật sự sống trong câu chuyện.']};
function carHTML(){
  const slides=CONCEPTS.map(c=>{const s=STORY[c],l=muas.filter(m=>m.concept===c),lo=Math.min(...l.filter(m=>m.base).map(m=>m.base));
    return `<div class="ps"><div class="pair one">${frame(coverFor(c)||IMG[ORDER[c][0]])}</div><div><div class="ch">${s[0]}</div><h3>${s[1]}</h3><p>${s[2]}</p><div class="meta">Makeup ${c} · ${l.length} nghệ sĩ${isFinite(lo)?' · từ '+fmtPrice(lo):''}</div><button class="btn btn-primary" onclick="tagGo('concepts','${c}')">Khám phá Makeup ${c} →</button></div></div>`;}).join('');
  return `<section class="princess"><img class="horse" src="${IMG.horse}"><img class="orn2" src="${IMG.orn}"><div class="pcar-head"><div class="crown">♛</div><h2>Once upon a glow…</h2><div class="orn" style="max-width:320px;margin:8px auto 0">4 CÂU CHUYỆN · LƯỚT ĐỂ KHÁM PHÁ</div></div>
<div class="pcar" id="pcar">${slides}</div><div class="pnav"><button class="ar" onclick="pcarGo(-1)">‹</button><div class="pdots">${CONCEPTS.map((_,i)=>`<i class="${i?'':'on'}" onclick="pcarGo(0,${i})"></i>`).join('')}</div><button class="ar" onclick="pcarGo(1)">›</button></div></section>`;}
function ctaHTML(){return `<section class="band sage" style="margin-top:44px;margin-bottom:-30px"><h2>Bạn là Makeup Artist?</h2><p>Tự tạo hồ sơ, đăng concept, bảng giá và ảnh sample looks của bạn để khách hàng tìm thấy bạn trên Glow Base. Hoàn toàn miễn phí.</p><button class="btn" style="background:#fff;color:var(--primary)" onclick="go('join')">Đăng hồ sơ của tôi ✿</button></section>`;}
function pcarGo(d,to){const c=document.getElementById('pcar');if(!c)return;let i=to!==undefined?to:Math.round(c.scrollLeft/c.clientWidth)+d;i=(i+CONCEPTS.length)%CONCEPTS.length;c.scrollTo({left:i*c.clientWidth,behavior:'smooth'});}
let _dn=0,_x0=0,_s0=0;
function initCar(){const c=document.getElementById('pcar');if(!c)return;const dots=[...document.querySelectorAll('.pdots i')];
  c.onscroll=()=>{const i=Math.round(c.scrollLeft/c.clientWidth);dots.forEach((d,k)=>d.classList.toggle('on',k===i));};
  c.onmousedown=e=>{_dn=1;_x0=e.pageX;_s0=c.scrollLeft;c.style.scrollSnapType='none';};
  window.onmousemove=e=>{const c=document.getElementById('pcar');if(_dn&&c)c.scrollLeft=_s0-(e.pageX-_x0);};
  window.onmouseup=()=>{const c=document.getElementById('pcar');if(!_dn||!c)return;_dn=0;c.style.scrollSnapType='';pcarGo(0,Math.round(c.scrollLeft/c.clientWidth));};}
const _rl=window.renderLanding;
window.renderLanding=()=>_rl().replace(/<section class="princess">[\s\S]*?<\/section>/,carHTML()).replace(/<section class="sec"><h2>Browse by Location[\s\S]*?<\/section>/,ctaHTML());

let jS={t:'Tại gia',c:[],av:''},jP=[[],[],[],[]];

function jT(el,t){jS.t=t;[...el.parentNode.children].forEach(x=>x.classList.toggle('on',x===el));jpv();}
function jC(i,el){const k=jS.c.indexOf(i);k<0?jS.c.push(i):jS.c.splice(k,1);el.classList.toggle('on',k<0);document.getElementById('jr'+i).classList.toggle('on',k<0);jpv();}
function rdF(f,cb){const r=new FileReader();r.onload=e=>cb(e.target.result);r.readAsDataURL(f);}
function jAv(inp){const f=inp.files[0];if(!f)return;rdF(f,s=>{jS.av=s;const a=document.getElementById('jav');a.style.backgroundImage=`url('${s}')`;a.textContent='';jpv();});}
function jUp(i,inp){[...inp.files].slice(0,6-jP[i].length).forEach(f=>rdF(f,s=>{jP[i].push(s);jth(i);jpv();}));inp.value='';}
function jth(i){document.getElementById('jt'+i).innerHTML=jP[i].map((s,k)=>`<div class="ph"><img src="${s}"><div class="rm" onclick="jP[${i}].splice(${k},1);jth(${i});jpv()">×</div></div>`).join('');}
function jpv(){const el=document.getElementById('jpv');if(!el)return;const cs=[...jS.c].sort();const ph=jS.av||(cs.length&&jP[cs[0]][0])||IMG.garden;
  el.innerHTML=`${frame(ph)}<h3>${esc(jv('jn')||'Tên nghệ sĩ của bạn')}</h3><div class="by">${cs.length?cs.map(i=>'Makeup '+JC[i]).join(' · '):'Chưa chọn concept'}</div><div class="tag-row" style="margin-top:8px"><span class="tag">${jS.t}</span><span class="tag">${jv('jp')||'Tỉnh / thành'}</span></div><div class="loc-line" style="margin-top:8px">📍 ${esc(jv('ja')||'Địa chỉ của bạn')}</div>`;}
function renderJoin(){jS={t:'Tại gia',c:[],av:''};jP=[[],[],[],[]];const d=document.createElement('div');d.id='jwrap';
  d.innerHTML=`<h1 class="pg-title">Dành cho Makeup Artist</h1><div class="orn">✦ ✦ ✦</div><p style="max-width:640px;color:var(--text2);line-height:1.7;margin:-6px 0 22px">Tự tạo hồ sơ, đăng concept, bảng giá và ảnh sample looks của bạn. Khách hàng sẽ xem, lưu và liên hệ trực tiếp với bạn.</p>
<div class="jn-steps"><div class="jn-step"><b>1 · Tạo hồ sơ</b><span>Thông tin, loại hình, khu vực</span></div><div class="jn-step"><b>2 · Đăng concept</b><span>Ảnh sample và giá từng concept</span></div><div class="jn-step"><b>3 · Nhận khách</b><span>Khách liên hệ trực tiếp với bạn</span></div></div>
<div class="jn-grid"><div>
<div class="block"><h2>1 · Hồ sơ nghệ sĩ</h2>
<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div id="jav" class="pf-av" style="width:92px;height:92px;background-color:var(--lilac);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text2)">Ảnh</div><label class="photo-upload-btn" style="margin:0">📷 Tải ảnh đại diện<input type="file" accept="image/*" hidden onchange="jAv(this)"></label></div>
<label>Tên / nghệ danh *</label><input type="text" id="jn" oninput="jpv()" placeholder="Ví dụ: Linh Nguyễn Makeup">
<label>Loại hình *</label><div class="jtype"><div class="on" onclick="jT(this,'Tại gia')"><b>Tại gia</b><small>Làm tại nhà riêng, nhận khách theo lịch hẹn</small></div><div onclick="jT(this,'Studio')"><b>Studio</b><small>Có studio / cửa hàng riêng</small></div></div>
<label>Giới thiệu ngắn</label><textarea id="jb" maxlength="300" placeholder="Phong cách sở trường, số năm kinh nghiệm, điểm nổi bật…"></textarea></div>

<label>Địa chỉ *</label><input type="text" id="ja" oninput="jpv()" placeholder="Số nhà, đường, quận / huyện"><label class="jchk"><input type="checkbox" id="jm"> Tôi nhận makeup tại nhà khách (di chuyển)</label></div>
<div class="block"><h2>3 · Concept & bảng giá</h2><div style="font-size:14px;color:var(--text2);margin:-8px 0 12px">Chọn các concept bạn nhận, mỗi concept có ảnh và giá riêng.</div>
<div>${JC.map((c,i)=>`<span class="chip-select" onclick="jC(${i},this)">${c}</span>`).join('')}</div>
${JC.map((c,i)=>`<div class="jc-row" id="jr${i}"><div style="font-family:'EB Garamond',serif;font-size:21px;color:var(--primary);font-weight:600;margin-bottom:8px">Makeup ${c}</div><div class="jf2"><div><label style="margin-top:0">Giá từ (đ)</label><input type="text" inputmode="numeric" id="jmin${i}" placeholder="500000"></div><div><label style="margin-top:0">Đến (đ)</label><input type="text" inputmode="numeric" id="jmax${i}" placeholder="1500000"></div></div><div style="font-size:12px;color:var(--text2);margin-top:6px">Để trống nếu muốn hiển thị “Liên hệ báo giá”.</div>

</div><aside class="jn-prev"><div class="pcard" style="cursor:default"><div style="font-size:12px;letter-spacing:3px;color:var(--text2);margin-bottom:10px">XEM TRƯỚC</div><div id="jpv"></div></div><div style="font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6">Hồ sơ được Glow Base kiểm duyệt trong 24–48h trước khi hiển thị công khai.</div></aside></div>`;
  setTimeout(jpv,0);return d;}
function jSubmit(){const name=jv('jn'),prov=jv('jp'),addr=jv('ja'),cs=[...jS.c].sort();
  const lk=(t,x)=>{if(!x)return null;if(t==='phone')return{type:t,label:x,href:'tel:'+x.replace(/\s/g,'')};if(t==='email')return{type:t,label:x,href:'mailto:'+x};const P={facebook:'https://facebook.com/',instagram:'https://instagram.com/',tiktok:'https://tiktok.com/@',website:'https://'}[t];return{type:t,label:x.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,''),href:/^https?:/.test(x)?x:P+x.replace(/^@/,'')};};
  const contacts=JT.map((t,i)=>lk(t[0],jv('jc'+i))).filter(Boolean);
  if(!name||!prov||!addr)return toast('Vui lòng điền tên, tỉnh/thành và địa chỉ');
  if(!cs.length)return toast('Hãy chọn ít nhất 1 concept');
  if(cs.some(i=>!jP[i].length))return toast('Mỗi concept cần ít nhất 1 ảnh sample');

/* ---- 1. Đăng ký bằng Gmail + mã xác minh ---- */
let REG=null,REGT=null;
const GMAIL_RE=/^[a-z0-9][a-z0-9.]{4,28}[a-z0-9]@gmail\.com$/i;
const okGmail=e=>GMAIL_RE.test(e)&&!/\.\./.test(e);
/* Móc gửi mail. Trang tĩnh KHÔNG thể tự gửi email thật (không có máy chủ).
   Khi có dịch vụ gửi mail (EmailJS, Resend, Firebase…), thay thân hàm này bằng lệnh gọi thật
   và bỏ khung "hộp thư giả lập" trong regVerifyForm. */
function sendVerificationEmail(to,code){return Promise.resolve({demo:true});}
const _om7=window.openModal;
window.openModal=k=>{if(k!=='register'){REG=null;clearInterval(REGT);return _om7(k);}regForm();};
function regShell(body){document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">×</button><h2>✦ Glow Base</h2>${body}</div></div>`;}
function regForm(){const r=REG||{};
 regShell(`<div class="sub">Tạo tài khoản bằng Gmail ♡</div><label>Tên hiển thị</label><input type="text" id="regName" placeholder="Ví dụ: Minh Châu" value="${esc(r.name||'')}"><label>Gmail</label><input type="email" id="regEmail" placeholder="tenban@gmail.com" value="${esc(r.email||'')}"><label>Mật khẩu</label><input type="password" id="regPass" placeholder="Ít nhất 8 ký tự, gồm chữ và số" value="${esc(r.pass||'')}"><label>Xác nhận mật khẩu</label><input type="password" id="regPass2" placeholder="••••••••" value="${esc(r.pass||'')}"><button class="btn btn-primary" onclick="regSend()">Gửi mã xác minh</button><div class="switch-line">Đã có tài khoản? <b onclick="openModal('login')">Đăng nhập</b></div>`);}
function newCode(){const a=new Uint32Array(1);crypto.getRandomValues(a);return String(100000+a[0]%900000);}
function regSend(){const g=id=>document.getElementById(id),v=id=>g(id).value.trim();let ok=true;const bad=(id,m)=>{jerr(g(id),m);ok=false;};['regName','regEmail','regPass','regPass2'].forEach(i=>jerr(g(i),''));
 const name=v('regName'),email=v('regEmail').toLowerCase(),pass=g('regPass').value,p2=g('regPass2').value;
 if(name.length<2)bad('regName','Vui lòng nhập tên hiển thị (ít nhất 2 ký tự).');
 if(!okGmail(email))bad('regEmail','Vui lòng nhập địa chỉ Gmail hợp lệ (dạng tenban@gmail.com).');else if(users[email])bad('regEmail','Gmail này đã được đăng ký.');
 if(pass.length<8||!/[A-Za-z]/.test(pass)||!/\d/.test(pass))bad('regPass','Mật khẩu cần ít nhất 8 ký tự, gồm cả chữ và số.');
 if(p2!==pass)bad('regPass2','Mật khẩu xác nhận không khớp.');
 if(!ok)return;
 REG={name,email,pass,code:newCode(),exp:Date.now()+5*60e3,tries:0,sentAt:Date.now()};
 sendVerificationEmail(email,REG.code).then(()=>regVerifyForm());}
function regVerifyForm(){const r=REG;
 regShell(`<div class="sub">Nhập mã xác minh đã gửi tới<br><b>${esc(r.email)}</b></div>
<div class="demo-mail"><small>HỘP THƯ GIẢ LẬP (chỉ để demo — trang chưa có máy chủ gửi email thật)</small>Thư gửi tới ${esc(r.email)}:<br>Mã xác minh Glow Base của bạn là<b class="code">${r.code}</b><small>Có hiệu lực trong 5 phút. Không chia sẻ mã này cho bất kỳ ai.</small></div>
<label>Mã gồm 6 chữ số</label><input type="text" id="regCode" class="code-in" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code" oninput="this.value=this.value.replace(/\D/g,'')" onkeydown="if(event.key==='Enter')regVerify()">
<button class="btn btn-primary" onclick="regVerify()">Xác minh & tạo tài khoản</button>
<div style="display:flex;justify-content:space-between;margin-top:14px"><button class="reg-link" onclick="regForm()">← Đổi Gmail</button><button class="reg-link" id="regResend" onclick="regResend()" disabled></button></div>`);
 clearInterval(REGT);const tick=()=>{const b=document.getElementById('regResend');if(!b){clearInterval(REGT);return;}const left=Math.ceil((REG.sentAt+60e3-Date.now())/1000);b.disabled=left>0;b.textContent=left>0?`Gửi lại mã sau ${left}s`:'Gửi lại mã';};tick();REGT=setInterval(tick,1000);}
function regResend(){if(!REG||Date.now()-REG.sentAt<60e3)return;REG.code=newCode();REG.exp=Date.now()+5*60e3;REG.tries=0;REG.sentAt=Date.now();sendVerificationEmail(REG.email,REG.code).then(()=>{regVerifyForm();toast('Đã gửi lại mã mới ✨');});}
function regVerify(){const el=document.getElementById('regCode'),c=el.value.trim();if(!REG)return regForm();
 if(Date.now()>REG.exp)return jerr(el,'Mã đã hết hạn. Hãy bấm “Gửi lại mã”.');
 if(REG.tries>=5)return jerr(el,'Bạn đã nhập sai quá 5 lần. Hãy bấm “Gửi lại mã” để nhận mã mới.');
 if(!/^\d{6}$/.test(c))return jerr(el,'Mã xác minh gồm đúng 6 chữ số.');
 if(c!==REG.code){REG.tries++;return jerr(el,`Mã không đúng. Bạn còn ${5-REG.tries} lần thử.`);}
 const r=REG;REG=null;clearInterval(REGT);users[r.email]={name:r.name,pass:r.pass,verified:true};currentUser={id:r.email,name:r.name};closeModal();toast('Xác minh thành công, tài khoản đã tạo ✨');render();}
/* ---- 2. Hồ sơ MUA tới admin ngay lập tức ---- */
const SYNC={db:null,ok:null,q:Promise.resolve(),sig:{}};
const revOf=x=>Math.max(x.submittedAt||0,x.reviewedAt||0,x.rev||0);
const sigOf=x=>[x.status,x.reviewedAt||0,x.submittedAt,x.muaIds.length,JSON.stringify(x.data).length,x.reason||''].join('|');
SUBS.forEach(x=>SYNC.sig[x.id]=sigOf(x));
function imgShrink(src,max,q){return new Promise(res=>{if(!/^data:image/.test(src||''))return res(src);const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q));};im.onerror=()=>res(src);im.src=src;});}
async function shrinkSub(x){const c=JSON.parse(JSON.stringify(x)),d=c.data;
 for(const [m,q] of [[9999,1],[480,.6],[360,.5],[260,.45],[180,.4]]){if(m<9999){d.avatar=await imgShrink(x.data.avatar,m,q);for(let i=0;i<d.concepts.length;i++)d.concepts[i].photos=await Promise.all(x.data.concepts[i].photos.map(p=>imgShrink(p,m,q)));}if(JSON.stringify(c).length<235000)return c;}
 d.concepts.forEach(k=>k.photos=k.photos.slice(0,1));d.trimmed=true;return c;}
function setSyncNote(){const e=document.getElementById('syncNote');if(!e)return;const base='<b>Admin nhận hồ sơ ngay khi bạn bấm Gửi.</b> 24–48 giờ là thời gian Glow Base xem xét và phản hồi kết quả cho bạn.';
 e.className='sync-note'+(SYNC.ok===false?' warn':'');
 e.innerHTML=SYNC.ok===true?'✓ Hồ sơ đã được gửi tới admin. '+base:SYNC.ok===false?'Hồ sơ đã được lưu trên thiết bị này và hiện trong trang Admin ngay khi admin mở trang trên cùng trình duyệt. Tài khoản của bạn chưa có quyền gửi lên kho dùng chung nên các thiết bị khác chưa thấy được. '+base:'Đang gửi tới admin… '+base;}
function pushSub(x){if(!SYNC.db||SYNC.ok===false)return;SYNC.q=SYNC.q.then(async()=>{try{const c=await shrinkSub(x);await SYNC.db.collection('submissions').doc(x.id).set(JSON.parse(JSON.stringify(c)));SYNC.ok=true;}catch(e){if(SYNC.ok!==true)SYNC.ok=false;}setSyncNote();});}
function syncSubs(){let ch=false;SUBS.forEach(x=>{if(x.sample)return;const g=sigOf(x);if(SYNC.sig[x.id]!==g){x.rev=Date.now();SYNC.sig[x.id]=g;ch=true;pushSub(x);}});if(ch)saveSubs();setSyncNote();}
const syncSoon=()=>setTimeout(syncSubs,0);
function mergeRemote(list,initial){let ch=false;list.forEach(r=>{if(!r||!r.id||!r.data)return;const l=subBy(r.id);
 if(!l){SUBS.push(r);SYNC.sig[r.id]=sigOf(r);if(r.status==='approved'){r.muaIds=[];publishSub(r);}ch=true;if(!initial&&isAdmin()&&r.status==='pending')toast('Có hồ sơ MUA mới: '+r.data.name);}
 else if(revOf(r)>revOf(l)){if(l.status==='approved')unpublishSub(l);Object.assign(l,r);SYNC.sig[l.id]=sigOf(l);if(l.status==='approved'){l.muaIds=[];publishSub(l);}ch=true;if(!initial&&isAdmin()&&l.status==='pending')toast('Hồ sơ MUA vừa được cập nhật: '+l.data.name);}});
 if(ch){saveSubs();if(['admin','mysubs','joined'].includes(route.page))render();else paintDot();}}
window.addEventListener('storage',e=>{if(e.key!==SK)return;try{mergeRemote(JSON.parse(e.newValue||'[]'),false);}catch(x){}});
(async()=>{try{if(!(window.claude&&claude.use)){SYNC.ok=false;return;}
 const [db,u]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db){SYNC.ok=false;setSyncNote();return;}
 SYNC.db=db;let cw=null;try{cw=u&&u.can?await u.can('data.write'):null;}catch(e){}if(cw===false){SYNC.ok=false;setSyncNote();}
 let first=true;db.collection('submissions').onSnapshot(snap=>{const docs=snap.docs.map(d=>d.data()).filter(Boolean);mergeRemote(docs,first);
  if(first){first=false;SUBS.filter(x=>!x.sample&&!docs.some(r=>r.id===x.id)).forEach(pushSub);}},()=>{});
}catch(e){SYNC.ok=false;}})();
['jFinish','admOk','admNo','admDown'].forEach(n=>{const f=window[n];if(typeof f!=='function')return;window[n]=function(){const r=f.apply(this,arguments);syncSoon();return r;};});
/* ---- chấm đỏ báo admin có hồ sơ chờ duyệt ---- */
function paintDot(){const b=document.querySelector('#authArea .avatar-btn');if(b)b.classList.toggle('has-new',!!(currentUser&&isAdmin()&&SUBS.some(x=>x.status==='pending')));}
const _r7=window.render;
window.render=()=>{_r7();paintDot();if(route.page==='joined'){const b=document.querySelector('#app .block');if(b&&!document.getElementById('syncNote')){b.insertAdjacentHTML('beforeend','<div id="syncNote"></div>');setSyncNote();}}};
/* ---- xoá concept / artist: hộp thoại riêng (confirm() của trình duyệt có thể bị chặn trong khung nhúng) ---- */
function askConfirm(msg,ok){document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Xác nhận xoá</h2><div class="sub">${esc(msg)}</div><div class="confirm-actions"><button class="btn btn-ghost" onclick="closeModal()">Huỷ</button><button class="btn btn-primary" id="cfOk">Xoá</button></div></div></div>`;document.getElementById('cfOk').onclick=()=>{closeModal();ok();};}
window.admDelConcept=id=>{if(!isAdmin())return;askConfirm('Xoá concept này? Hành động không thể hoàn tác.',()=>{delMua(id);toast('Đã xoá concept');if(route.page==='detail')go('explore');else render();syncSoon();});};
window.admDelArtist=id=>{const m=byId(id);if(!isAdmin()||!m)return;askConfirm(`Xoá artist “${m.name}” cùng tất cả concept? Hành động không thể hoàn tác.`,()=>{muas.filter(x=>x.name===m.name).map(x=>x.id).forEach(delMua);toast('Đã xoá artist');go('explore');syncSoon();});};
render();
</script>

<script>
/* ===== tìm kiếm không dấu ===== */
const noDia=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
const dg8=t=>String(t||'').replace(/\D/g,'');
const _f8=window.filteredMuas;
window.filteredMuas=()=>{const s=exploreState,raw=s.q||'';s.q='';let l;try{l=_f8();}finally{s.q=raw;}
 const q=raw.trim();if(!q)return l;const toks=noDia(q).split(/\s+/).filter(Boolean),qd=dg8(q);
 return l.filter(m=>{const hay=noDia([m.name,m.concept,m.address,m.province,(m.areas||[]).join(' ')].join(' '));
  if(toks.every(t=>hay.includes(t)))return true;
  const ph=dg8((m.phone||'')+(m.contacts||[]).filter(c=>c.type==='phone').map(c=>c.label).join(' '));return qd.length>=3&&ph.includes(qd);});};
render();
</script>
